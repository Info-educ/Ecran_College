name: Nettoyage images carrousel

on:
  schedule:
    - cron: '0 3 * * 1'   # Chaque lundi à 3h du matin
  workflow_dispatch:        # Déclenchement manuel possible

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Supprimer les images de plus de 3 semaines (sauf celles encore affichées)
        run: |
          # Seuil : 21 jours
          CUTOFF=$(date -d '21 days ago' +%Y%m%d)
          echo "Suppression des images antérieures au $CUTOFF"

          DELETED=0
          KEPT=0

          # CORRECTION : on ne supprime plus une image encore référencée par
          # data.json. Avant, une information laissée plus de 3 semaines au
          # carrousel (ou un interstitiel plein écran de longue durée) voyait
          # son image disparaître du dépôt, et l'écran affichait un cadre vide.
          # L'intention du nettoyage est de supprimer les images INUTILISÉES.
          if [ -d images ]; then
            for f in images/*; do
              [ -f "$f" ] || continue
              BASENAME=$(basename "$f")

              # Image encore citée dans data.json -> on garde, quel que soit son âge
              if [ -f data.json ] && grep -qF "$BASENAME" data.json; then
                echo "  · Conservé (encore affiché) : $f"
                KEPT=$((KEPT + 1))
                continue
              fi

              # Les fichiers dans images/ sont nommés AAAAMMJJ_HHmm_nom.ext
              # On extrait la date du préfixe et on compare avec le seuil
              FILEDATE="${BASENAME:0:8}"
              # Vérifier que c'est bien un nombre (format attendu)
              if echo "$FILEDATE" | grep -qE '^[0-9]{8}$'; then
                if [ "$FILEDATE" -lt "$CUTOFF" ]; then
                  echo "  → Suppression : $f (date $FILEDATE)"
                  git rm "$f"
                  DELETED=$((DELETED + 1))
                fi
              else
                echo "  · Ignoré (nom sans date) : $f"
              fi
            done
          fi

          echo "Images conservées car encore affichées : $KEPT"

          if [ "$DELETED" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "🧹 Nettoyage : $DELETED image(s) de plus de 3 semaines supprimée(s)"
            git push
            echo "✅ $DELETED image(s) supprimée(s)."
          else
            echo "✅ Aucune image à supprimer."
          fi
